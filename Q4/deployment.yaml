apiVersion: apps/v1
kind: Deployment
metadata:
    name: spam-api
spec:
    replicas: 2

    selector: 
        matchLabels:
            app: spam-api
    template:
        metadata:
            labels:
                app: spam-api
        spec:
            containers:
            - name: spam-api
              image: spam-api-k8s:v1
              imagePullPolicy: IfNotPresent
              ports:
              - containerPort: 8000
              resources:
                requests:
                    cpu: "250m"
                limits:
                    cpu: "500m"
              readinessProbe:
                httpGet:
                    path: /healthz
                    port: 8000
                initialDelaySeconds: 5
                periodSeconds: 5

