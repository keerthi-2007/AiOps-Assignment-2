apiVersion: batch/v1
kind: Job

metadata:
    name: shard-validator-job
    labels:
        app: shard-validator
spec:
    completions: 8
    parallelism: 4
    completionMode: Indexed
    backoffLimit: 0
    activeDeadlineSeconds: 300

    template:
        metadata:
            labels:
                app: shard-validator
        spec:
            restartPolicy: Never

            containers:
            - name: validator
              image: shard-validator:v2
              imagePullPolicy: IfNotPresent

              env:
              - name: SHARD_DIR
                value: "/app/shards"

              - name: POD_NAME
                valueFrom:
                    fieldRef:
                        fieldPath: metadata.name
              - name: NODE_NAME
                valueFrom:
                    fieldRef:
                        fieldPath: spec.nodeName
              - name: JOB_COMPLETION_INDEX
                valueFrom:
                    fieldRef:
                        fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
              resources:
                requests:
                    cpu: "1"
                limits:
                    cpu: "1"
